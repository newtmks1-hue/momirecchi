<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>駐車場のご案内 | Re:af</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #1b2b22;
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    overscroll-behavior: none;
  }

  .wrap {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }

  .header {
    width: 100%;
    text-align: center;
    padding: 18px 12px 14px;
    color: #f4e9c9;
  }

  .header .label {
    font-size: 13px;
    letter-spacing: 0.15em;
    color: #b7d8b0;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: 21px;
    font-weight: 700;
    color: #f4e9c9;
  }

  .video-stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  video {
    width: 100%;
    max-height: 78dvh;
    border-radius: 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    background: #000;
    display: block;
  }

  .sound-btn {
    position: absolute;
    right: 20px;
    bottom: 20px;
    background: rgba(20, 30, 22, 0.72);
    color: #f4e9c9;
    border: 1px solid rgba(244, 233, 201, 0.5);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 14px;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(3px);
  }

  .footer-note {
    color: #9fb89a;
    font-size: 12.5px;
    text-align: center;
    padding: 16px 20px 22px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="label">Re:af</div>
      <h1>駐車場のご案内</h1>
    </div>

    <div class="video-stage">
      <video id="video" playsinline autoplay muted loop preload="auto">
        <source src="parking.mp4" type="video/mp4">
        お使いのブラウザは動画の再生に対応していません。
      </video>
      <button class="sound-btn" id="soundBtn">🔇 音声オフ</button>
    </div>

    <p class="footer-note">動画をタップすると一時停止・再生ができます</p>
  </div>

  <script>
    const video = document.getElementById('video');
    const soundBtn = document.getElementById('soundBtn');

    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      soundBtn.textContent = video.muted ? '🔇 音声オフ' : '🔊 音声オン';
    });

    video.addEventListener('click', () => {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    });
  </script>
</body>
</html>
