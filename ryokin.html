<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Re:af 料金案内</title>
<style>
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #fdf6f0;
    margin: 0;
    padding: 20px 16px 60px;
    color: #3a3a3a;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    color: #4a7c63;
    margin-bottom: 4px;
  }
  .sub {
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-bottom: 24px;
  }
  .course {
    background: white;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .course-title {
    font-size: 17px;
    font-weight: bold;
    color: #4a7c63;
    margin-bottom: 12px;
    border-left: 5px solid #4a7c63;
    padding-left: 10px;
  }
  .price-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 4px;
    border-bottom: 1px solid #f0ebe4;
    font-size: 15px;
  }
  .price-row:last-child { border-bottom: none; }
  .price-row .time { color: #555; }
  .price-row .price {
    font-size: 19px;
    font-weight: bold;
    color: #3a3a3a;
  }
  .note {
    font-size: 12px;
    color: #b06a3a;
    background: #fbeee0;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 6px;
  }
  .free-note {
    font-size: 13px;
    color: #666;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>
<h1>Re:af 料金案内</h1>
<div class="sub">もみレッチ（旧Re:af）</div>

<div class="course">
  <div class="course-title">揉みほぐし・ストレッチ</div>
  <div class="price-row"><span class="time">60分</span><span class="price">¥3,000</span></div>
  <div class="price-row"><span class="time">90分</span><span class="price">¥4,500</span></div>
</div>

<div class="course">
  <div class="course-title">揉みほぐし＋本格ストレッチ</div>
  <div class="price-row"><span class="time">60分</span><span class="price">¥4,000</span></div>
  <div class="price-row"><span class="time">90分</span><span class="price">¥6,000</span></div>
</div>

<div class="course">
  <div class="course-title">足ツボ（OIL・クリーム）</div>
  <div class="price-row"><span class="time">追加メニュー</span><span class="price">¥0</span></div>
  <div class="free-note">ご希望の方は施術時間内であれば行いますので、お気軽にお申し付けください。</div>
</div>

<div class="note">
  2026年8月21日以前にご来店いただいたお客様は、当面の間、料金の変更はございません。
</div>

</body>
</html>
